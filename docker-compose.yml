services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  scraper:
    build: ./scraper
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: job_hunter
      SCRAPER_URL: http://scraper:8000
      SCRAPER_TOKEN: ${SERVICE_TOKEN:-change-me}
      SCRAPE_INTERVAL_HOURS: ${SCRAPE_INTERVAL_HOURS:-6}
      APP_USERNAME: ${APP_USERNAME:-me}
      APP_PASSWORD: ${APP_PASSWORD:-}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - scraper

volumes:
  mongo_data:
